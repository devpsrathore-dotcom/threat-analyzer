<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threat Analyzer</title>
  <meta name="description" content="THREAT ANALYZER - static file, log and live-system threat analysis">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2.5 4.5 7v8.2c0 7.1 4.9 12.6 11.5 14.3 6.6-1.7 11.5-7.2 11.5-14.3V7L16 2.5Z' fill='%23ffffff' stroke='%23333333' stroke-width='2.2'/%3E%3Cpath d='M10 16.5h3.2l1.8-4.2 2.6 8 1.8-3.8H22' fill='none' stroke='%23333333' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2.5 4.5 7v8.2c0 7.1 4.9 12.6 11.5 14.3 6.6-1.7 11.5-7.2 11.5-14.3V7L16 2.5Z" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M10 16.5h3.2l1.8-4.2 2.6 8 1.8-3.8H22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="brand-name">THREAT ANALYZER</div>
          <div class="brand-sub">File · Log · System analysis</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <div class="nav-section">Overview</div>
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/history" data-route="history">Reports <span class="nav-count" id="nav-history-count"></span></a>
        <div class="nav-section">Analyze</div>
        <a href="#/scan" data-route="scan">File Scan</a>
        <a href="#/logs" data-route="logs">Log Analysis</a>
        <a href="#/system" data-route="system">System Audit</a>
        <a href="#/hash" data-route="hash">Hash a File</a>
        <div class="nav-section">Engine</div>
        <a href="#/rules" data-route="rules">Detection Rules</a>
        <a href="#/selftest" data-route="selftest">Self-test</a>
      </nav>

      <div class="engine-status" id="engine-status">
        <span class="dot"></span><span class="engine-text">Connecting…</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <div>
          <h1 id="page-title">Dashboard</h1>
          <div class="page-sub" id="page-sub"></div>
        </div>
      </header>
      <div id="banner"></div>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js"></script>

</html>
